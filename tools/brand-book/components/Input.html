<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
  <label class="ks-field"><span class="ks-field__label">Name</span><input class="ks-input" id="p-name" placeholder="Your name"><span class="ks-field__help">As it appears on your company profile.</span></label>
  <label class="ks-field"><span class="ks-field__label">Work email</span><input class="ks-input ks-input--focus" id="p-email" value="cto@company.com"></label>
  <label class="ks-field ks-field--error"><span class="ks-field__label">Phone</span><input class="ks-input ks-input--error" id="p-phone" value="+1 555"><span class="ks-field__error">Enter the full number with country code.</span></label>
</div>
